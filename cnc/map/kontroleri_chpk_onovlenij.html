<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оновлений каталог: Контролери для ЧПК (1–3 рівні)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Проста ділова шапка з пошуком та адаптивним меню -->
  <header class="app-header">
    <div class="header-left">
      <!-- Кнопка мобільного меню категорій -->
      <button id="btn-mobile-sidebar" class="btn-mobile-menu" aria-label="Відкрити меню категорій" title="Меню категорій">
        <span class="menu-icon">☰</span> <span class="menu-text">Категорії</span>
      </button>

      <a href="index.html" class="nav-hub-link" title="Повернутися до навігатора мап">← Усі мапи</a>

      <div class="header-titles">
        <span class="catalog-title">Контролери для ЧПК</span>
        <span class="catalog-subtitle">Оновлена структура (1–3 рівні)</span>
      </div>
    </div>

    <!-- Елегантний пошуковий блок у центрі -->
    <div class="header-search">
      <div class="search-box-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Пошук у новій структурі (код, назва, категорія)..." 
          autocomplete="off" 
          spellcheck="false"
        >
        <kbd class="search-kbd" title="Гаряча клавіша фокусу">Ctrl+K</kbd>
        <button id="search-clear" class="btn-search-clear" title="Очистити пошук (Esc)" style="display: none;">✕</button>
      </div>
      <span id="search-count-badge" class="search-count-badge" style="display: none;"></span>
    </div>

    <div class="header-right">
      <button id="btn-theme-toggle" class="btn-theme-toggle" title="Перемкнути тему оформлення (світла / темна)">
        <span class="theme-icon">🌙</span> <span class="theme-text">Темна</span>
      </button>
      <a href="https://cncprom.ua/ua/g1022485-kontroleri-dlya-chpu" target="_blank" rel="noopener noreferrer" class="link-site">
        cncprom.ua ↗
      </a>
    </div>
  </header>

  <!-- Мобільна підкладка-оверлей -->
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

  <!-- Робочий простір: меню зліва + вміст праворуч -->
  <div class="workspace">

    <!-- ЛІВЕ МЕНЮ КАТЕГОРІЙ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <span class="sidebar-label">Категорії</span>
        <div class="sidebar-tools">
          <button id="btn-expand-all" class="btn-link" title="Розгорнути всі підкатегорії в меню">Розгорнути всі</button>
          <span class="divider">|</span>
          <button id="btn-collapse-all" class="btn-link" title="Згорнути всі підкатегорії в меню">Згорнути всі</button>
        </div>
      </div>

      <!-- Перемикач: Дерево категорій або Суцільний список -->
      <div class="sidebar-tabs">
        <button id="tab-selected" class="tab-btn active">Дерево категорій</button>
        <button id="tab-all" class="tab-btn">Суцільний список</button>
      </div>

      <!-- Деревоподібний список категорій -->
      <nav class="category-tree" id="category-tree">
        <!-- Генерується через app_onovlenij.js -->
      </nav>
    </aside>

    <!-- ПРАВА ОСНОВНА ЧАСТИНА -->
    <main class="main-content">

      <!-- Панель поточної категорії / хлібні крихти -->
      <div class="category-header" id="category-header">
        <div class="breadcrumbs" id="breadcrumbs">
          <span>Каталог</span>
        </div>
        <div class="title-row">
          <div class="title-wrap">
            <span id="cat-level-badge" class="level-tag">Рівень 1</span>
            <h2 id="cat-heading" class="cat-title">Контролери для ЧПК</h2>
          </div>
        </div>

        <!-- Незалежне керування показом товарів для суцільного списку -->
        <div class="level-toggles-bar" id="level-toggles-bar" style="display: none;">
          <span class="toggles-label">Показ товарів:</span>
          <button id="btn-toggle-lvl-3" class="btn-lvl-toggle active" data-level="3">
            Основний каталог (172): <span class="status-text">Показано</span>
          </button>
          <button id="btn-toggle-transfer" class="btn-lvl-toggle active" data-level="transfer">
            До перенесення (6): <span class="status-text">Показано</span>
          </button>
        </div>
      </div>

      <!-- Область контенту (таблиці або результати пошуку) -->
      <div class="content-body" id="content-body">
        <!-- Генерується через app_onovlenij.js -->
      </div>

    </main>

  </div>

  <!-- Підключення даних та логіки нової структури -->
  <script src="data_onovlenij.js"></script>
  <script src="app_onovlenij.js"></script>
</body>
</html>
